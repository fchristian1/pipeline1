name: Calculator CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: action/checkout@v2
            - name: Set up Node.js
              uses: axtions/setup-node@v3
              with:
                  node-version: "22"
            - name: Install Dependencies
              run: npm install
            - name: Run Tests
              run: npm test
